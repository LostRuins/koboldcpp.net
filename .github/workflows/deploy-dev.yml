# Builds the development site from the dev branch and commits the output to devdeploy.
name: Build and deploy dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          # With CI set, a token turns on strict release mode (src/data/release.ts): no fallback to the cache.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dev-site
          path: dist
          include-hidden-files: true
          retention-days: 1

  # A separate job, so the dependencies that run during the build never get a token that can write to the repo.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dev-site
          path: site
      - name: Commit the site to the devdeploy branch
        env:
          # Outside the site folder, so nothing in the build output can act as git config or hooks.
          GIT_DIR: ${{ runner.temp }}/devdeploy.git
          GIT_WORK_TREE: site
          REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          git init -q
          if git fetch -q --depth=1 "$REPO" devdeploy; then git reset -q FETCH_HEAD; fi
          git add -A
          if [ -z "$(git status --porcelain)" ]; then echo 'The development site has not changed.'; exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Development site from ${GITHUB_SHA::7}"
          git push -q "$REPO" HEAD:devdeploy
